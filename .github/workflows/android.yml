name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib Dependencies
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install newgrounds
          haxelib install actuate
          haxelib install polymod
          haxelib install extension-webm
          haxelib install hxcpp

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Android Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Lime Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT

          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT

          haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicExe-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk