name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Setup Haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install Libraries
  run: |
    haxelib install lime 8.1.3
    haxelib install openfl 9.2.2
    haxelib install flixel 4.11.0
    haxelib install flixel-addons 2.11.0
    haxelib install flixel-ui 2.5.0
    haxelib install hscript 2.5.0
    haxelib install newgrounds 1.2.0
    haxelib install actuate 1.9.0
    haxelib install polymod 1.7.0
    haxelib install hxcpp 4.2.1

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Android Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Lime Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT

          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Remove Desktop Only Libraries
        run: |
          sed -i '/extension-webm/d' Project.xml
          sed -i '/discord_rpc/d' Project.xml
          sed -i '/linc_luajit/d' Project.xml

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT

          haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicExe-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk